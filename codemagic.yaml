workflows:
  trontuner-ios:
    name: TronTuner iOS Unsigned

    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: v22.11.0
      xcode: latest
      cocoapods: default

    scripts:

      - name: Vérifier le projet
        script: |
          echo "=== TronTuner ==="
          ls -la
          test -f index.html

      - name: Préparer Capacitor
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Préparer les fichiers web
        script: |
          mkdir -p www
          cp index.html www/index.html

      - name: Créer le projet iOS
        script: |
          npx cap add ios

      - name: Synchroniser l'application web
        script: |
          npx cap sync ios

      - name: Vérifier les fichiers iOS
        script: |
          echo "=== Structure iOS ==="
          find ios -maxdepth 3 -type f | sort

      - name: Compiler pour le simulateur iOS
        script: |
          cd ios/App

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
