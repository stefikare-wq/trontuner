workflows:
  trontuner-ios:
    name: TronTuner iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: v22.11.0
      xcode: latest
      cocoapods: default
     
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stefikare.trontuner
   
    scripts:
      - name: Vérifier le projet
        script: |
          echo "=== TronTuner ==="
          ls -la
          test -f index.html

      - name: Préparer Capacitor
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Préparer les fichiers web
        script: |
          mkdir -p www
          cp index.html www/index.html

      - name: Créer le projet iOS
        script: |
          npx cap add ios

      - name: Synchroniser l'application web
        script: |
          npx cap sync ios

      - name: Configurer la signature iOS
      script: xcode-project use-profiles

    - name: Générer l'IPA signé
      script: |
        cd ios/App
        xcode-project build-ipa --project App.xcodeproj --scheme App

  artifacts:
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    - /tmp/xcodebuild_logs/*.log
    - ios/App/build/ios/ipa/*.ipa
